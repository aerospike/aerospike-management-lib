name: Tests
on:
  push:
    branches:
      - "*"
    tags:
      - v*
  pull_request:
    branches:
      - master
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Get go version from go.mod
      run: |
        echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> $GITHUB_ENV
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Install dependencies
      run: |
        echo "CWD=$(pwd)" >> $GITHUB_ENV
        git clone https://github.com/aerospike/schemas.git
    - name: Generate Mocks
      run: |
        make mocks
    - name: Test with go
      env:
        TEST_SCHEMA_DIR: ${{ env.CWD }}/schemas/json/aerospike
      run: |
        make coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        files: coverage.cov
        verbose: false
